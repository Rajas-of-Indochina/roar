 tenet_cranial_trophies_name:0 "Cranial Trophies"
 tenet_headhunting_name:0 "Headhunting"
 tenet_headhunting_dayak_name:0 "Ngayau"
 tenet_headhunting_filipino_name:0 "Pugot"
 tenet_headhunting_nias_name:0 "Manga'i binu"
 tenet_headhunting_desc:0 "Collecting human heads in a divine act in itself. The head contains the soul, and a human soul is the greatest offering one can make to [ROOT.Faith.PantheonTerm]."
 doctrine_parameter_headhunting_active:0 "May fight [rivals|E] or others who have committed [crimes|E] against you in to the death in [Concept('single_combat_fight','Ritual Combat')|E], taking their head as a trophy"

 INCOMPATIBLE_TENET_COMMUNAL_IDENTITY_TRIGGER:1 "Incompatible with the [core_tenet|E] [GetFaithDoctrine('tenet_communal_identity').GetName( GetPlayer.GetFaith )]"
 INCOMPATIBLE_TENET_ANCESTOR_WORSHIP_TRIGGER:1 "Incompatible with the [core_tenet|E] [GetFaithDoctrine('tenet_ancestor_worship').GetName( GetPlayer.GetFaith )]"
 INCOMPATIBLE_TENET_SPIRIT_GUIDES_TRIGGER:0 "Incompatible with the [core_tenet|E] [GetFaithDoctrine('tenet_spirit_guides').GetName( GetPlayer.GetFaith )]"
 INCOMPATIBLE_TENET_ADORCISM_TRIGGER:0 "Incompatible with the [core_tenet|E] [GetFaithDoctrine('tenet_adorcism').GetName( GetPlayer.GetFaith )]"

 tenet_rationalism_generic_name:0 "Rationalism"
 tenet_rationalism_generic_desc:0 "Our faith follows a strong tradition of rationalism, critical thinking and inquiry."

 tenet_dhammavicaya_name:0 "Dhamma Vicaya"
 tenet_dhammavicaya_desc:0 "This concept implies applying discernment to body-mind phenomena in order to apply right effort, giving way to entry into the first jhana. Through analysis, debate, and meditation we can better understand the path to enlightenment."
 doctrine_parameter_literalist_debate_enabled:0 "May debate other lords of the realm at the cost of [opinion|E], to gain or lose [piety|E]"

 tenet_spirit_guides_name:0 "Spirit Guides"
 tenet_spirit_guides_desc:1 "Our shamans serve the important duty of contacting and sometimes controlling the invisible spirits that surround us. As this role is intrinsically linked to femininity, anybody who demonstrates this connection can act as a spirit guide, regardless of their birth."

 tenet_yaoshun_kingdom_name:0 "Yaoshun Kingdom"
 tenet_yaoshun_kingdom_desc:0 "Our shamans serve the important duty of contacting and sometimes controlling the invisible spirits that surround us. As this role is intrinsically linked to femininity, anybody who demonstrates this connection can act as a spirit guide, regardless of their birth."

 tenet_rationalism_confucianism_name:0 "Four Books"
 tenet_unrelenting_faith_confucianism_name:0 "Rangyi"


 # Special Doctrines
 special_doctrine_is_hinduism_faith_name:0 "Teachings of the Vedas"
 special_doctrine_is_hinduism_faith_desc:0 "The sacred Vedas are respected throughout the various Sampradayas, their teachings provide wisdom for many to learn from."

 special_doctrine_is_jainism_faith_name:0 "Teachings of Mahavira"
 special_doctrine_is_jainism_faith_desc:0 "The teachings of the 24th Tirthankara Mahavira who taught the ancient Jain faith. He helped to recreate the Jain Sangha and following his teachings will lead us to moksha."

 special_doctrine_is_buddhist_faith_name:0 "Teachings of Gautama Buddha"
 special_doctrine_is_buddhist_faith_desc:0 "While many branches have come about since he achieved enlightenment, it is through his teachings that the path to englightenment is found."

 special_doctrine_is_lolo_faith_name:0 "Lolo Spiritual Traditions"
 special_doctrine_is_lolo_faith_desc:0 "Though distinct, the religious traditions of the various Lolo cultures of Yunnan largely coexist without hostility."
 doctrine_parameter_hostility_override_special_doctrine_is_lolo_faith:0 "Considers Lolo [faiths|E], and is considered by Lolo $game_concept_faiths$, to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] instead of $hostility_evil_tooltippable$"

 doctrine_three_teachings_name:0 "Three Teachings"
 special_doctrine_three_teachings_name:0 "Three Teachings"
 special_doctrine_three_teachings_desc:0 "The beliefs of Confucianism, Taoism, and Mahayana Buddhism are often called the Three Teachings Harmonious As One, a reflection of their history and interconnectedness within the Middle Kingdom."
 doctrine_parameter_hostility_override_special_doctrine_three_teachings:0 "Other [faiths|E] that have the Three Teachings doctrine are considered [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"

 monarchianism_name:0 "Monarchianism"
 special_doctrine_monarchianist_name:0 "$monarchianism_name$"
 special_doctrine_monarchianist_desc:0 "While the Christian mainstream believes that the Father, Son and Holy Spirit exist in a holy trinity, three beings of one essence, some disagree. Monarchianism is the believe that God is a singular being, either switching between Father, Son and Spirit as Modalists believe, or existing as an indivisible whole that adopted Christ into godhood as [GetFaithByKey('adoptionist').GetAdherentNamePlural] believe."
 doctrine_parameter_hostility_override_special_doctrine_monarchianist:0 "Other [faiths|E] that have the $special_doctrine_monarchianist_name$ doctrine are considered [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"

 doctrine_special_succession:0 "Special Succession Doctrines"
 special_doctrine_nasrani_partition_succession_law_name:0 "Syriac Partition"
 special_doctrine_nasrani_partition_succession_law_desc:0 "$tradition_nasrani_partition_desc$"
 doctrine_parameter_unlock_nasrani_succession:0 "$culture_parameter_can_enact_nasrani_partition_succession_law$"
 doctrine_parameter_unlock_nasrani_succession_tradition:0 "Can choose the [GetCultureTradition('tradition_nasrani_partition').GetName] [tradition|E] regardless of [heritage|E]"

 doctrine_mz_syncretism_name:0 "Religious Syncretism"
 doctrine_mz_no_syncretism_name:0 "One True Faith"
 doctrine_mz_no_syncretism_desc:0 "Ours is the one truth faith."
 doctrine_mz_no_syncretism_effect:0 "One True Faith"


 # Misc faiths
 indo_hellenism:0 "Yavanadharma"
 indo_hellenism_adj:0 "Yavanadharmic"
 indo_hellenism_adherent:0 "Indo-Hellene"
 indo_hellenism_adherent_plural:0 "Indo-Hellenes"
 indo_hellenism_desc:0 "A form of Hellenic religion that grew out of the meeting of Hellenic people with Indian customs during the Indo-Greek Kingdom of antiquity, Indo-Hellenic beliefs persisted even generations after its fall."


 # Christian stuff
 indian_catholic:0 "Nasrani"
 indian_catholic_adj:0 "$indian_catholic$"
 indian_catholic_adherent:0 "$indian_catholic$"
 indian_catholic_adherent_plural:0 "$indian_catholic$"
 indian_catholic_desc:0 "Claiming descent from the church of St. Thomas, the Christians of India are a broad, varied and adaptable group, with some identifying with Latin, Orthodox, Syriac or various other liturgical rites. They have historically been a small minority group along the Malabar coast."
 indian_catholic_religious_head_title:0 "Pērāyar"
 indian_catholic_religious_head_title_name:0 "$indian_catholic_religious_head_title$"

 d_indian_catholic_papacy:0 "$indian_catholic_religious_head_title$ of St. Thomas"
 d_indian_catholic_papacy_adj:0 "Thomasine"

 orthodox: "Greek Orthodoxy" #Don't want the anachronistic 'Byzantine'. Even Eastern Orthodox wasn't used till more recently. Going with what it actually was called in this timeframe also keeps it consistent with other Orthodox churches such as the Bulgarian and Georgian churches. I'm sure I'll get some complaints still.
 orthodox_adj: "Greek Orthodox"
 orthodox_desc: "The Orthodox Church is the other main branch of Chalcedonian Christianity that up until 1054 was formally united with the Catholic Church, although the political division can be traced back to the crowning of Charlemagne as Roman Emperor by Pope Leo III in 800, which did not sit well with the Emperor in Constantinople. The nominal head of the Orthodox Church is the Ecumenical Patriarch of Constantinople, but he does not interfere in the affairs of other Patriarchs."


