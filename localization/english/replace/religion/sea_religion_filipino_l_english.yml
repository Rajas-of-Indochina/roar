 talaingat_ariya_desc:0 "To the indigenous inhabitants of the Western Philippines, it is important to hold reverence for the natural world and its many gods and spirits through adherence to a wide set of taboos. For instance, because the world rests on the back of a giant crocodile named Dapu, we cannot work the land without giving paraya, the blood offering of a white chicken. Similarly, because this white chicken, Manalastas, is a god in their own right, they are made to fight another cock such that the gods can decide their fate."

