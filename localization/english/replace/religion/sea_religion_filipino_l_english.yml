 # Babaylanan - Bisaya, Palaw'an and Balanghayan people
 dayawism:0 "Babaylanan"
 dayawism_adj:0 "Babaylanan"
 dayawism_adherent:0 "Babaylanan"
 dayawism_adherent_plural:0 "Babaylanan"
 dayawism_desc:0 "The babaylanan represent the religious traditions of Filipinos that migrated out from the Eastern Philippines into Panay, Buglas, and Southern Luzon. Their traditions emphasize the role of the Babaylan as intercessors between humans and the spirits, communing with them on behalf of their people, and in turn making the will of the gods known through dreams and visions, the endowment of an intuitive understanding of the world around them, and even letting the gods be physically manifest in their bodies through ritual possession."

