 surong_puyo_adherent:0 "Agtataripnong" # those who gather together in Ilokano
 surong_puyo_adherent_plural:0 "Agtataripnong"
 surong_puyo_desc:0 "The inhabitants of the Northern Philippines believe that the universe ought to be understood in terms of surong, the upstream flow of energy manifest in life and creation, and puyupoyan, the downstream ebbing of energy that is death. This shapes how the people of the Northern Philippines practice their religion—creating effigies of their ancestors and sending offerings to the dead, or atang, downstream such that they might follow them into the afterlife."

