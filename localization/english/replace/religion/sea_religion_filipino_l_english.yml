 # Pagongowan so Darang - Manuvu/Mindanao people
 darang:0 "Pagongowan so Darangen"
 darang_adj:0 "Pagongowan" # the act of keeping (a tradition alive)
 darang_adherent:0 "Tomotonggo" # those who conserve, Maranaw
 darang_adherent_plural:0 "Tomotonggo"
 darang_desc:0 "The Darangen, meaning 'that which is narrated by song', describe the religions of both the original inhabitants of Mindanao and the early migrants into the island from Visayas. The inhabitants of Mindanao keep rich oral traditions, immortalizing the deeds of their ancestors through a vast collection of epics accompanied by song and dance. The most notable of these epics, also called Darangen, not only recounts the heroism of Prince Bantugan but also enshrines the vast corpus of customary laws, traditions, and social values that underscore their society."

