 game_concept_stateless:0 "Stateless"
 game_concept_stateless_desc:0 "A stateless society lacks the formal hierarchies of other forms of governance. Each "ruler" is a representative of their lands whose actions are held to account by the people. Succession within a commune is elective, with each representative having a say. Stateless communes can band together into a [stateless_confederation|E], and over time as the confedation becomes more tightly knit it can centralize into a [tribal_government|E]"
