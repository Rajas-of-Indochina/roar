 stateless_martial_court_position: "Head of the Warriors"
 stateless_martial_court_position_desc: "The $stateless_martial_court_position$ is a member of the community who has been entrusted with directing affairs relating to training for defense and coordinating strategy in times of war."
 stateless_martial_court_position_task_prepare_defenses: "Prepare Defenses"
 stateless_martial_court_position_task_prepare_defenses_desc:0 "Your $stateless_martial_court_position$ will direct the commune to prepare for an invasion, fortifying and getting ready to defend their homes."

 stateless_learning_court_position: "Head of the Spirits"
 stateless_learning_court_position_desc: "The $stateless_learning_court_position$ is entrusted by the community to keep the rituals of the community and see to their spiritual well-being, as well as dealing with the spirits on the community's behalf."
 stateless_learning_court_position_task_perform_rituals: "Perform Rituals"
 stateless_learning_court_position_task_perform_rituals_desc: "You will direct your $stateless_learning_court_position$ to focus on performing religious rituals."
 stateless_learning_court_position_task_perform_rituals_tt:0 "Eventually I'll implement monthly events to fire for this. - malonkey1"
 stateless_learning_court_position_task_learn_foreign_faiths: "Learn Foreign Faiths"
 stateless_learning_court_position_task_learn_foreign_faiths_desc: "Your $stateless_learning_court_position$ will learn about the religions of other communities, and how to respect their beliefs."
 stateless_learning_court_position_task_learn_foreign_faiths_tt:0 "$stateless_learning_court_position_task_perform_rituals_tt$"

 stateless_diplomacy_court_position: "Head of the People"
 stateless_diplomacy_court_position_desc: "The $stateless_diplomacy_court_position$ sees to the people of the community, as well as serving as an envoy to those around us and helping to maintain social cohesion and cohesion with other nearby communities."
 stateless_diplomacy_court_position_task_cohesion: "Foster Cohesion"
 stateless_diplomacy_court_position_task_cohesion_desc: "Your $stateless_diplomacy_court_position$ works on fostering cohesion between members of your confederation."
 stateless_diplomacy_court_position_task_cohesion_tt:0 "Increases the [cohesion|E] of your [stateless_confederation|E] by ['(CFixedPoint)0'|+] - ['(CFixedPoint)0.25'|+] based on [aptitude|E] ([liege.MakeScope.ScriptValue('stateless_cohesion_court_position_task_effect')|+]) each month."
 stateless_diplomacy_court_position_task_cohesion_monthly_tt:0 "$stateless_learning_court_position_task_perform_rituals_tt$"
 stateless_diplomacy_court_position_task_harmony: "Promote Cultural Harmony"
 stateless_diplomacy_court_position_task_harmony_desc: "Your $stateless_diplomacy_court_position$ will focus on engendering social harmony between the peoples in the commune and its neighbors, trying to smooth over cultural differences."
