 centralize_stateless_confederation_decision_desc:0 "Our society has become more and more centralized and more and more hierarchical, through no fault of my own. With each passing day it becomes more clear that the communes of [ROOT.Char.GetConfederation.GetName] require a leader. A ruler. A king."