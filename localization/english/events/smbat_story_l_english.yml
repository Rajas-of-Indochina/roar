l_english:
 smbat_story.0001.t: "The End of Smbat of Zarehawan?"
 smbat_story.0001.desc: "It seems that my journey may be at an end. I've fought for years against the [GetFaithByKey('armenian_apostolic').GetName] church and against the feudal lords of Armenia, and it has ended with me here, imprisoned and alone. And yet, for some reason, I cannot help but feel that God has other plans for me. As I sit, my chains growing heavier by the day, I feel something. A draft! I can see a gap in the stones, and with a little work, I can make an opening!\nWriggling through the small hole in the wall, I manage to steal away to find my comrades awaiting me. Gathered around me, they look to me for guidance, asking what we must next do."
 smbat_story.0001.a: "We must off to Syunik!"
 smbat_story.0001.b: "The princes of Armenia haven't gotten rid of us that easily!"
 smbat_story.0001.c: "Sod this, I'm going to Babylon."

 HERESIARCH_LABEL: "Heresiarch"
 smbat_of_zarehawan: "The Tondrakian Movement"
 smbat_of_zarehawan_desc: "Bruised but not beaten, the resistance to feudal oppression lives on and the Tondrakian faith grows by the day. In history the movement rose then fell, slowly petering out. Will you change its course and tear down the lords that rule Armenia?"
 game_concept_tondrakian_rebelliousness: "Tondrakian Rebelliousness"
 game_concept_tondrakian_rebelliousness_desc: "Rebelliousness measures how radicalized the Tondrakian movement has become. As it rises, Tondrakians are more likely to engage in uprisings against their theocratic and secular rulers, but are also more likely to engage in activities that could draw the ire of the law.\nRebelliousness naturally ticks toward [GetFaithByKey('tondrakian').GetAdjective] [fervor|E], but can be raised or lowered by events."
 game_concept_tondrakian_righteousness: "Tondrakian Righteousness"
 game_concept_tondrakian_righteousness_desc: "Righteousness is a rough measure of the reputation of how good the reputation of the Tondrakian Movement is. At high levels, it can allow you to more easily reach the ears of the people, letting you convert counties and characters more reliably, but also makes it difficult to build up the [Concept('tondrakian_rebelliousness','Rebelliousness')] you need to stage a proper revolt. Contrariwise, a low [Concept('tondrakian_righteousness','Righteousness')] makes the faith less palatable, but also radicalizes those already faithful."
 game_concept_tondrakian_rebelliousness_docile: "Docile"
 game_concept_tondrakian_rebelliousness_docile_desc: "At low levels of [tondrakian_rebelliousness|E], Tondrakians are mollified and unwilling to engage in radical acts of resistance. This keeps the movement at a low profile, but also makes spreading the faith more difficult."
 game_concept_tondrakian_rebelliousness_insurrectionary: "Insurrectionary"
 game_concept_tondrakian_rebelliousness_insurrectionary_desc: "At high levels of [tondrakian_rebelliousness|E], Tondrakian counties become much harder for non-Tondrakian rulers to manage, and are much more likely to join or create factions, lose control, and help hide you. However, it also makes rulers much more hostile to the movement."
 game_concept_tondrakian_righteousness_sinful: "Sinful"
 game_concept_tondrakian_righteousness_sinful_desc: "At very low levels of [tondrakian_righteousness|E], the movement looks less like a religion and more like a gang of heretical thugs. Those that follow the faith will be more radical, causing [tondrakian_rebelliousness|E] to rise more quickly, but will also make attempts to spread the faith more difficult."
 game_concept_tondrakian_righteousness_sanctified: "Sanctified"
 game_concept_tondrakian_righteousness_sanctified_desc: "At high levels of [tondrakian_righteousness|E], the movement is able to portray itself as righteous, moral, and Christ-like, giving it more moral weight to compete with the [GetFaithByKey('armenian_apostolic').GetAdjective] church. This makes events that raise [tondrakian_rebelliousness|E] less common but makes attempts at spreading the faith more likely to bear fruit."
 LABEL_TONDRAKIAN_REBELLIOUSNESS: "[tondrakian_rebelliousness|E]"
 LABEL_DOCILE: "[tondrakian_rebelliousness_docile|E]"
 LABEL_INSURRECTIONIST: "[tondrakian_rebelliousness_insurrectionary|E]"
 LABEL_TONDRAKIAN_RIGHTEOUSNESS: "[tondrakian_righteousness|E]"
 LABEL_SINFUL: "[tondrakian_righteousness_sinful|E]"
 LABEL_SANCTIFIED: "[tondrakian_righteousness_sanctified|E]"
 TONDRAKIAN_REBELLIOUSNESS_TOOLTIP: "Current #BOLD [Concept('tondrakian_rebelliousness','Rebelliousness')]#! Value: [Story.MakeScope.Var('rebelliousness').GetValue|V0]\nTarget #BOLD [Concept('tondrakian_rebelliousness','Rebelliousness')]#! Value: [Story.MakeScope.Var('the_faith').Faith.GetFervor|V0]"
 