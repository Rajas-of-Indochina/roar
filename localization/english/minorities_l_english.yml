 # Events
 minorities.0100.cancel:0 "Perhaps not..."

 minorities.0300.t:0 "Promoting Minorities?"
 minorities.0300.desc:0 "The people of my realm are not totally homogenous. Perhaps I should consider promoting the growth of one of the minority communities within my borders?"
 minorities.0300.religion:0 "Promote a faith"
 minorities.0300.culture:0 "Promote a culture"
 minorities.0300.confirm:0 "I have made my decision!"

 minorities.0301.t:0 "Religious Expulsion"
 minorities.0301.desc:0 "All manner of heretic, infidel, and schismatic hides within the hidden underbelly of my realm, but I will tolerate it no longer! I have summoned [councillor.GetName] to direct [councillor.GetHerHim] in finally ridding [county.GetNameNoTier] of the vile..."
 minorities.0301.confirm:0 "CAST THEM OUT!"
 begin_expel_faith_tt:0 "[councillor.GetFirstNameNoTooltip] will begin expelling the [GetPlayer.MakeScope.Var('selected_faith').Faith.GetTextIcon][GetPlayer.MakeScope.Var('selected_faith').Faith.GetAdjective] [minority_faith|E] in [county.GetNameNoTier]"
 
 minorities.0302.t:0 "Ethnic Expulsion"
 minorities.0302.desc:0 "Foreign reprobates have taken up residence in my lands, with their strange and wicked customs, complaints of their horrid stench reaching my ears daily. Today, I summon [councillor.GetName] to have [councillor.GetHerHim] finally cleanse [county.GetNameNoTier] of the plague of..."
 begin_expel_culture_tt:0 "[councillor.GetFirstNameNoTooltip] will begin expelling the [GetPlayer.MakeScope.Var('selected_culture').Culture.GetName] [minority_culture|E] in [county.GetNameNoTier]"

