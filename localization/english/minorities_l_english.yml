l_english:
#  Game Concepts
 game_concept_minority:0 "Minority"
 game_concept_minority_small:0 "Small Minority"
 game_concept_minority_large:0 "Large Minority"
 game_concept_minorities:0 "Minorities"
 game_concept_minority_desc:0 "A Minority represents a portion of the population of a [county|E] which follows another [faith|E] or belongs to another [culture|E].\n\nMinorities may be small or large. A small minority may grow to become a large minority, and a large minority may grow enough to displace the original faith of the county, which becomes a new minority in that county."

 game_concept_minority_culture:0 "Cultural Minority"
 game_concept_minority_cultures:0 "Cultural Minorities"
 game_concept_minority_culture_small:0 "Small Cultural Minority"
 game_concept_minority_culture_large:0 "Large Cultural Minority"
 game_concept_minority_culture_desc:0 "A Cultural Minority is a [minority|E] that represents a portion of the county whose [culture|E] is different from that of the county."

 game_concept_minority_faith:0 "Religious Minority"
 game_concept_minority_faith_small:0 "Small Religious Minority"
 game_concept_minority_faith_large:0 "Large Religious Minority"
 game_concept_minority_faiths:0 "Religious Minorities"
 game_concept_minority_faith_desc:0 "A Religious Minority is a [minority|E] that represents a portion of the county that follows a different [faith|E] from the rest of the county."

 game_concept_migrate_minority:0 "$game_concept_migrate$"
 game_concept_minority_migration:0 "$game_concept_migration$"
 game_concept_migrate_minority_desc:0 "When expelled via the $task_expel_cultural_minority$ or $task_expel_religious_minority$ [councillor_tasks|E], [minorities|E] will seek out a new random county to take up residence in, with the attractiveness of the county based on its [development|E], the [dread|E] of its [top_liege|E], as well as how cosmopolitan and accommodating the county is to that minority."

 # Council Tasks

 task_conversion_china_promotion_effect_desc:0 "#S At #V 100%#!#!:\n$TAB$The [county|E] will promote a minority [councillor.GetLiege.GetFaith.GetTextIcon][councillor.GetLiege.GetFaith.GetName] population."
 task_conversion_promotion_effect_desc:0 "#S At #V 100%#!#!:\n$TAB$The [county|E] will promote a minority [councillor.GetFaith.GetTextIcon][councillor.GetFaith.GetAdjective] population."
 MINORITIES_SYSTEM_REASON:0 "Minorities System"

 task_promote_minority:0 "Promote Minority in County"
 task_promote_minority_effect_desc:0 "A [minority|E] in the [county|E] will be promoted."
 task_promote_minority_effect_desc_faith:0 "A [county.MakeScope.Var('faith_to_convert').Faith.GetTextIcon][county.MakeScope.Var('faith_to_convert').Faith.GetAdjective] [minority_faith|E] will be promoted in the [county|E]."
 task_promote_minority_effect_desc_culture:0 "A [county.MakeScope.Var('culture_to_convert').Culture.GetName] [minority_culture|E] will be promoted in the [county|E]."
 must_have_different_faith_or_culture_to_promote_tt:0 "[county.GetNameNoTier] has no minorities you can promote!"

 task_expel_religious_minority:0 "Expel Religious Minorities"
 task_expel_religious_minority_desc:0 "Expel a [minority_faith|E] from the [county|E]"
 task_expel_religious_minority_active_desc:0 "Expel the [county.MakeScope.Var('faith_to_expel').Faith.GetTextIcon][county.MakeScope.Var('faith_to_expel').Faith.GetAdjective] [minority_faith|E] in [county.GetNameNoTier]"

 task_expel_cultural_minority:0 "Expel Cultural Minorities"
 task_expel_cultural_minority_desc:0 "Expel a [minority_culture|E] from the [county|E]"
 task_expel_cultural_minority_active_desc:0  "Expel the [county.MakeScope.Var('culture_to_expel').Culture.GetName] [minority_culture|E] in [county.GetNameNoTier]"

 task_invite_settlers:0 "Invite Settlers"
 task_kurultai_invite_settlers_1:0 "$task_invite_settlers$"
 task_kurultai_invite_settlers_2:0 "$task_invite_settlers$"
 task_kurultai_invite_settlers_3:0 "$task_invite_settlers$"
 task_kurultai_invite_settlers_4:0 "$task_invite_settlers$"
 task_invite_settlers_effect_desc:0 "Invite settlers from a foreign [county|E] to become [minorities|E] in your own."
 task_invite_settlers_effect_culture_desc:0 "\n$EFFECT_LIST_BULLET$ A [county.GetProvince.GetCounty.GetCulture.GetName] [minority_culture|E] may appear in one of your counties."
 task_invite_settlers_effect_faith_desc:0 "\n$EFFECT_LIST_BULLET$ A [county.GetProvince.GetCounty.GetFaith.GetTextIcon][county.GetProvince.GetCounty.GetFaith.GetAdjective] [minority_faith|E] may appear in one of your counties."
 CHANCELLOR_INVITE_SETTLERS_PROGRESS_BASE:0 "$COURT_CHAPLAIN_PROGRESS_BASE$"
 DISASTER_RECOVERY_REASON:0 "[natural_disaster|E] recovery"
 NOT_BORDERING_REALM_REASON:0 "[county.GetNameNoTier] not bordering [realm|E]"
 CHANCELLOR_INVITE_SETTLERS_INNOVATION_BONUS_EAST_SETTLING:0 "$STEWARD_PROMOTE_CULTURE_INNOVATION_BONUS_EAST_SETTLING$"
 CRUSADER_STATE_REASON:0 "[GetTrait('crusader_king').GetName( councillor_liege )]"
 invite_settlers_different_faith_culture_tt:0 "None of my counties have a different [faith|E] or [culture|E] from [county.GetNameNoTier]"
 MINORITIES_DISTANCE_FACTOR: "Distance from my [realm_capital|E]"

 # Laws
 MY_REALM_WINDOW_LAWS_MINORITY_LAWS:0 "Minority Laws"
 religious_minorities_law:0 "Religious Policies"
 religious_minorities_law_singular:0 "Religious Policy"
 religious_minorities_harsh:0 "Harsh Religious Policy"
 religious_minorities_harsh_effects:0 "$EFFECT_LIST_BULLET$#indent_newline:3 [minority_faiths|E] will be #N less likely#! to [migrate_minority|E] to your [realm|E].#!\n$EFFECT_LIST_BULLET$#indent_newline:3 $task_promote_minority$ [councillor_task|E] can't promote [minority_faiths|E].#!\n$EFFECT_LIST_BULLET$#indent_newline:3 $task_invite_settlers$ [councillor_task|E] must target same-faith counties.#!"
 religious_minorities_lenient:0 "Lenient Religious Policy"
 religious_minorities_lenient_effects:0 "$EFFECT_LIST_BULLET$#indent_newline:3 $task_promote_minority$ [councillor_task|E] can promote [minority_faiths|E].#!\n$EFFECT_LIST_BULLET$#indent_newline:3 $task_invite_settlers$ [councillor_task|E] can target different-faith counties.#!"
 religious_minorities_welcoming:0 "Cosmopolitan Religious Policy"
 religious_minorities_welcoming_effects:0 "$EFFECT_LIST_BULLET$#indent_newline:3 [minority_faiths|E] will be #P more likely#! to [migrate_minority|E] to your [realm|E].#!\n$EFFECT_LIST_BULLET$#indent_newline:3 $task_promote_minority$ [councillor_task|E] can promote [minority_faiths|E].#!\n$EFFECT_LIST_BULLET$#indent_newline:3 $task_invite_settlers$ [councillor_task|E] can target different-faith counties.#!\n$EFFECT_LIST_BULLET$#indent_newline:3 $task_expel_religious_minority$ [councillor_task|E] disabled.#!"

 cultural_minorities_law:0 "Cultural Policies"
 cultural_minorities_law_singular:0 "Cultural Policy"
 cultural_minorities_harsh:0 "Harsh Cultural Policy"
 cultural_minorities_harsh_effects:0 "$EFFECT_LIST_BULLET$#indent_newline:3 [minority_cultures|E] will be #N less likely#! to [migrate_minority|E] to your [realm|E].#!\n$EFFECT_LIST_BULLET$#indent_newline:3 $task_promote_minority$ [councillor_task|E] can't promote [minority_cultures|E].#!\n$EFFECT_LIST_BULLET$#indent_newline:3 $task_invite_settlers$ [councillor_task|E] must target same-culture counties.#!"
 cultural_minorities_lenient:0 "Lenient Cultural Policy"
 cultural_minorities_lenient_effects:0 "$EFFECT_LIST_BULLET$#indent_newline:3 $task_promote_minority$ [councillor_task|E] can promote [minority_cultures|E].#!\n$EFFECT_LIST_BULLET$#indent_newline:3 $task_invite_settlers$ [councillor_task|E] can target different-culture counties.#!"
 cultural_minorities_welcoming:0 "Cosmopolitan Cultural Policy"
 cultural_minorities_welcoming_effects:0 "$EFFECT_LIST_BULLET$#indent_newline:3 [minority_cultures|E] will be #P more likely#! to [migrate_minority|E] to your [realm|E].#!\n$EFFECT_LIST_BULLET$#indent_newline:3 $task_promote_minority$ [councillor_task|E] can promote [minority_cultures|E].#!\n$EFFECT_LIST_BULLET$#indent_newline:3 $task_invite_settlers$ [councillor_task|E] can target different-culture counties.#!\n$EFFECT_LIST_BULLET$#indent_newline:3 $task_expel_cultural_minority$ [councillor_task|E] disabled.#!"

