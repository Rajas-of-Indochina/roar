l_english:

 # Asilian Pack
 SEA_NOMADS_GLOSS: "#bold Sea Nomad#! is a term applied to various ethnic groups in some parts of maritime Southeast Asia, who have traditionally, to varying extents, lived and traveled on boats and whose livelihoods depend greatly on the sea. These include the Orang Laut of Malaysia and Sumatra, the Moken on the border of Thailand and Malaysia, and the Sama-Bajau peoples of eastern Indonesia and the southern Philippines. Not all of these peoples are entirely nomadic or sea-based; some merely live by the coast and depend greatly on it. Regardless, historially, these peoples had close relations with kingdoms in the region; their skills were highly sought after, so they often served as mercenaries, pirates, merchants, and travel guides."
 GUNIG_GLOSS: "In the traditional beliefs of the Senoi peoples, a sub-category of the #italic Orang Asli#!, a collective term for the indigenes of peninsular Malaysia, #bold gunigs#! are spirit familiars who help people in various ways. Oftentimes, they find a #italic halaaq#! (also spelled #italic halaa#! or #italic halaa'#!), a ritual specialist somewhat analogous to a shaman, who they become attached to following a dream. Through this relationship, which is often seen as a rather intimate one, the #italic gunig#! can be summoned to protect or heal people, give advice, and assist in daily life."
 BAH_MALAYSIA_GLOSS: "Among the Aslian speakers of Malaysia, #bold Bah#! is typically a title of address reserved for men, often young men. At least in the modern day, it can have a mildly derogatory context as young men are seen as irresponsible and lacking in control."
 ORANG_ASLI_GLOSS: "#bold Orang Asli#! is a modern label given to the 18 indigenous ethnic groups of Peninsular Malaysia. These 18 ethnic groups are often further divided into three sub-groups:\n\n$BULLET_WITH_TAB$#bold Senoi:#! Mainly slash and burn agriculturalists and the largest of the three\n$BULLET_WITH_TAB$#bold Semang:#! Nomads who are “Negritos” (a term used to refer to various ethnic groups in SE Asia who superficially resemble Africans)\n$BULLET_WITH_TAB$#bold Proto-Malays:#! Settled farmers and seen as similar to Malays proper and may be descended from earlier waves of Austronesian speaking migrants\n\nWhile these groupings and that of the Orang Asli in general are nebulous and have their issues, these groups do share a number of traits, like, famously, a pacifist worldview."
 AUSTROASIATIC_GLOSS: "The #bold Austroasiatic#! languages are one of the major language families of the world. They are spoken across much of mainland Southeast Asia, and parts of China and South Asia as well, and were historically probably more dominant in the region until the arrival of later waves of Austronesian and Tai speakers. The largest Austroasiatic language, with far more speakers than all other Austroasiatic languages combined, is Vietnamese, with over 86 million native speakers as of 2023. Other major Austroasiatic languages with an extensive written tradition and historical record include Khmer (with 19 million native speakers) and Mon (with 1.1 million native speakers). The rest of the Austroasiatic languages are spoken by various minority groups in the region."
 GARUDA_GLOSS: "#bold Garudas#! are mythical creatures depicted often as eagle-headed men that are found in Hindu, Buddhist, and Jain mythology, and the mythologies of cultures influenced by these religions."
 SLAMAD_GLOSS: "#bold Slamad#!, or #bold Slamaad#!, is a central, cultural value among some of the indigenous Senoi peoples of peninsular Malaysia. The term roughly translates to peace, contentment, and public safety, and acting in such a way that one does not frustrate or thwart the desires of other people or beings (such as spirits)."


 # Manichean Pack
 ELECT_GLOSS: "The #bold Elect#! were members of the Manichean Church who functioned as clergy, having taken strict vows to eschew sinful acts, and to dedicate their lives to liberating the Light through prayer, ritual, and other religious actions. They were not allowed to harvest or prepare their own food, and could only eat one meal a day; this meal was an important ceremony where, through the act of consuming vegetarian meals, they could free the Light from the dark world of Matter. Although Manicheism probably did not have a monastic tradition initially, Manichean members of the Elect in eastern regions like Central Asia and China likely adopted a monastic lifestyle due to the influence of Buddhism."
 HEARER_GLOSS: "The #bold Hearers#! were the lay members of the Manichean Church. Though they did not have to follow the strict vows of the Elect, the Manichean clergy, they still had their own set of vows to follow to avoid sin. They were also required to engage in various fasting days and in a weekly ceremony to confess their sins. Additionally, they were encouraged to do 'soul-service' by supporting the Elect through alms and other forms of donations."
 ZINDIQ_GLOSS: "Though later used to indicate heretics in general, medieval Muslims originally used the term #bold Zindiq#! to  refer to followers of the Manichean religion."
 DINAVARIYA_GLOSS: "The #bold dinavariya#! was a Persian term, derived from the Middle Persian word 'denawar,' originally used by the Manicheans to refer to the Elect, members of the Manichean clergy. Over time, however, the Manicheans of the Iranian world and Central Asia began to use the word to self-identify themselves, as opposed to their western Manichean brethren. There was even a 6th or 7th century schism within the Manichean Church where schismastics in Transoxania, known as dinavariya, disputed the authority of the Manichean religious leadership in Babylon and criticized western Manicheans for their religious laxity. It would be incorrect to assume that dinavariya itself was an actual heresy, however, as the term likely predated the schism, and continued to be used for many more centuries.."
 MANICHEAN_PARINIRVANA_GLOSS: "In Manicheism, #bold Parinirvana#! has a different meaning than in Buddhism, which the term was derived from, due to Manicheans' propensity to assimilate other religions' vocabulary to spread their teachings. Buddhist parinirvana refers to the final passing away of a Buddha or other being who has attained nirvana, whereupon their physical existence ends and they have liberated themselves from the cycle of birth and rebirth. Manichean parinirvana, however, refers to the death and martyrdom of the Prophet Mani, which also is compared to the Passion of Jesus."


 # Oceania Pack
 CHELDEBECHEL_GLOSS: "Traditionally in Palau, #bold Cheldebechel#! were formal clubs that played an important societal role Micronesian nation of Palau. They were organized by age and gender, and had a variety of functions, such as educating younger generations about the roles in society, levying labor for public works projects, enforcing laws and protecting the community's economic and military interests, and so on."
 BITANG_ME_A_BITANG_GLOSS: "The principle of #bold bitang me a bitang#!, meaning “half and half” or “this side and that side,” is a Palauan concept of duality, where every entity is conceptually balanced between two opposite but complementary, connected sides. For instance, a person is not considered good nor bad, but both. In more practical terms, this affected Palau's traditional culture in many ways; clan lineages were divided in two groups, villages were geographically divided into two parts, and political interactions were also based on this principle."
 KWARAAE_WARRIOR_GHOSTS_GLOSS: "The Kwaraʼae, the largest indigenous group from Malaita Island in the Solomon islands, traditionally had great reverence for ghosts. Those who followed the proper rules of “living for the ghosts” could pray to them for support. Warriors could even summon warrior ghosts (#italic akalo ramo’a#!), also known as war ghosts (#italic akalo ni mae#!), who were once famous warriors, to support them in their feuds and conflicts against rival communities or clans. It was believed that while using these powers, men had to avoid the presence of women, who could neutralize such powers."
 SASI_GLOSS: "In parts of eastern Indonesia and Papua, there is a traditional custom of resource conservation often known as #bold Sasi#! (though it is known by various names in different languages, the term Sasi, which comes from the Maluku islands, is often used for convenience). A certain area is or type of resource is 'closed' for a period of time, such as one year, and during this time, people are forbidden from harvesting resources affected by the prohibition. For instance, if an area of coastline is closed, fishing is forbidden; or, one might be forbidden from foraging certain plants. Defying the Sasi would carry grave consequences, as it was believed to anger the spirits or ancestors. The Sasi would then be opened again in a ceremony after the time has passed."
 MEGAPODE_GLOSS: "#bold Megapodes#! are several species of related birds that resemble wild chickens and are native to the western Pacific, Australia, New Guinea, eastern Indonesia, and the Andaman and Nicobar Islands. They have a habit of incubating their eggs in small, concentrated nesting areas. For several indigenous groups in the region, the bids' eggs are a major source of food, and often gifted as signs of loyalty, friendship, and respect. Traditionally, ritual conventions in these areas restrict the harvest of these eggs."
 YAP_STONE_MONEY_GLOSS: "As late as the 20th century, the Yapese would travel far to the island of Palau to acquire limestone shaped into a disk with a hole in a center. Because of the large size of these #bold rai stones#!, which could be from a few inches to several feet wide, the voyage back could be perilous, and some lost their lives on the trip. The stones were used for currency, and their value came not only from its size or shape, but also from the oral history attached to the stone, such as who owned it in the past, or how many people died trying to haul it back to Yap. Such stories would be passed down for generations and confirmed its value, so it would be hard to steal the stone since everyone knew each stone's owner."


 # Tarim Pack
 LI_GLOSS: "#bold Lǐ#!, also known as the Chinese mile, is the traditional unit of distance in China that was supposedly instituted by the Yellow Emperor, a mythical ruler of early Chinese civilization. Though it has varied over time, one #italic lǐ#! roughly corresponds to a third of an English mile, or half a kilometer."
 JATAKA_GLOSS: "The #bold Jataka#! are a body of Buddhist tales originating from India that tell of various stories, mostly relating to the Buddha's previous lives, where he could be anything from a powerful god or king to a lowly animal like a monkey or insect. In these stories, the Buddha's previous self resolves the problems facing the characters to bring a happy ending, imparting some sort of moral lesson or aesop relating to Buddhist doctrine, particularly in regards to karma, the cycle of suffering, and rebirth. The jataka stories have been popular subjects of art and other literature throughout the centuries in Buddhist societies."


 # Zhangzhung Pack
 TERTON_GLOSS: "#bold Tertöns#!, or #bold treasure revealers#!, are those who have uncovered hidden religious texts called #bold terma#! in [GetFaithByKey('lamaism').GetName], or Tibetan Buddhism, and [GetFaithByKey('bon').GetName]. It is said that these teachings were hidden long ago by highly realized masters, particularly Padmasambhava in Buddhism, and Tonpa Shenrab in Bon, because people were not ready for the teachings yet, or to protect them from harm by evil forces. Although termas are often texts, they can also come in the form of statues, holy objects, dreams, humans, and more; termas can be found physically, such as in caves, under rocks or water, or within one's mind. Though strongly associated with the Nyingma school of Tibetan Buddhism, and Bon, tertöns have come from all schools of Tibetan Buddhism."
 TERMA_GLOSS: "#bold Terma#!, or #bold hidden treasures#!, are various forms of hidden teachings, particularly in the form of religious texts, in [GetFaithByKey('lamaism').GetName], or Tibetan Buddhism, and [GetFaithByKey('bon').GetName]. They are revealed by skilled #italic Tertöns#! (or treasure revealers). It is said that these teachings were hidden long ago by highly realized masters, particularly Padmasambhava in Buddhism, and Tonpa Shenrab in Bon, because people were not ready for the teachings yet, or to protect them from harm by evil forces. Although termas are often texts, they can also come in the form of statues, holy objects, dreams, humans, and more; termas can be found physically, such as in caves, under rocks or water, or within one's mind. Though strongly associated with the Nyingma school of Tibetan Buddhism, and Bon, tertöns have come from all schools of Tibetan Buddhism."
 GUTHUK_GLOSS: "#bold Guthuk#! is a stew soup in $heritage_tibetan_name$ cuisine made out of beans, vegetables, meats, and leftover grains. It is typically eaten two days before Losar, the traditional Tibetan New Year."
 DRESI_GLOSS: "#bold Dresi#! is a sweet dish in $heritage_tibetan_name$ cuisine made out of rice cooked in butter and mixed with raisins, #italic droma#! tubers, dates, and nuts."
 THUKPA_GLOSS: "#bold Dresi#! is a a general term for any noodle soup found in $heritage_tibetan_name$ cuisine. There are varying recipes for these kinds of noodle soups, including both vegetarian and non-vegetarian varieties."
 MOMO_GLOSS: "#bold Momos#! are a type of steamed, filled dumpling found in $heritage_tibetan_name$ cuisine. They can be filled with both meat or vegetables, and are eaten with a variety of sauces and condiments, such as spicy garlic sauce, pickled daikon, and so on. Sometimes they are also eaten in soups."
 DROKPA_GLOSS: "In Tibet, nomads, who still make up significant chunks of the population, are called #bold drokpas#!. The highlands of [GetGeographicalRegion('RICE_upper_tibet').GetName], known as the Changthang region, is particularly rugged and harsh even by Tibetan standards, and the #italic drokpas#! who live there are famous for being especially hardy and tough, in both medieval sources and in the present day."
 MANI_STONE_GLOSS: "In the Himalayan regions, #bold mani stones#! are stone plates, rocks, or pebbles that have mantras or other religious symbols carved on them, typically of a Buddhist nature. Even the creation of these stones by craftsmen is considered a meditational, religious act. Sometimes, people will even use stones that they find beautiful to place as mani stones, instead of those with designs carved on them."
 LOTSAWA_GLOSS: "#bold Lotsawa#! was a title bestowed on certain Tibetan scholars and monks who worked with Indian teachers to translate major [GetReligionByKey('buddhism_religion').GetAdjective] texts into the Tibetan language. These translators such as Rinchen Zangpo and Marpa played an important role in the spread of Buddhism into Tibet in the medieval period. The term likely came from the Sanskrit word #italic locchava#!, meaning 'bilingual' or 'eyes of the world.'"
 KARMIC_CONDITIONS_GLOSS: "In [GetReligionByKey('buddhism_religion').GetName], if #italic karma#! is thought of as cause and effect, then #bold karmic conditions#! denotes the former. It is one's past actions, good or bad, from this lifetime and past lifetimes, that eventually causes some sort of effect. That effect, when it happens, as it does not necessarily happen right away or even in this lifetime, is sometimes described using the term #bold karmic fruit#!."
 DAKINI_GLOSS: "A #bold Dakini#! is a type of female deity in [GetReligionByKey('buddhism_religion').GetName] and [GetReligionByKey('hinduism_religion').GetName]. Their exact role and purpose varies from spiritual sect to spiritual sect. In some sects, for instance, they are flesh-eating demonnesses. In Tibetan Buddhism, however, they are female representations of enlightenment, or human women who are seen as highly accomplished spiritually."
 BRUSHA_GLOSS: "In historical Tibetan sources, #bold Brusha#! is the name of a location corresponding to a historical medieval region in the western Himalayas known variously as Lesser Palola, Lesser Balor, or Lesser Bolu (in Chinese). It likely corresponds to somewhere around Gilgit and may be connected to the Burusho people, who speak Burushaski, a language isolate. This region likely served as the western frontier of the Tibetan Empire, and may have remained as the frontier of one of its successor states, the Kingdom of Guge, into the 11th century."
 TSAW_BVI_NANG_SKYID_GLOSS: "Salt harvesting in Tibet has historically been a highly ritualized affair; #italic drokpa#! men (i.e. nomad men) involved in these expeditions had to follow a strict code of conduct and perform various religious ceremonies during the journey. Once they return home with their salt, traditionally, the members of the harvesting team would partake in a #bold tsaw bvi nang skyid#! feast, which means 'happy gathering of salt porters.'"
 THANGKA_GLOSS: "#bold Thangkas#! are Tibetan scroll paintings on cotton or silk prominent in [GetFaithByKey('lamaism').GetName], or Tibetan Buddhism, and [GetFaithByKey('bon').GetName], that depict Buddhas, Bodhisattvas, protective deities, historical or legendary spiritual figures, and other religious beings or people. Oftentimes, there are many such figures on the thangka, surrouding a central figure who is the focus of the painting. Thangkas are typically hung and used to assist in meditation and other ritual practices. In the past, when it was harder to create them, they were highly prized objects."
 VAJRA_GLOSS: "The #bold vajra#! is a religious symbol and instrument in [GetReligionByKey('buddhism_religion').GetName] and [GetReligionByKey('hinduism_religion').GetName]. The vajra is typically a five-pronged ritual object extensively employed in tantric ceremonies. In Sanskrit, the word can mean #italic thunderbolt#! or #italic diamond#!, as it symbolizes the destruction of ignorance."
 SATER_GLOSS: "#bold Sater#! or #bold earth treasures#! are #italic terma#! of a material nature, such as statues, ritual artifacts, and scrolls, and are discovered by finding where they were concealed physically. They contrast with #italic gongter#!, or #italic mind treasures#!, which are discovered within one's mind."
 GONGTER_GLOSS: "#bold Gongter#! or #bold mind treasures#! are #italic terma#! of an immaterial nature, and are teachings transmitted through the mind. Oftentimes, the treasure revealer does not so much discover them, but instead, finds something that triggers their memory of having learned such knowledge in a past life. They contrast with #italic sater#!, or #italic earth treasures#!, which are discovered in a physical form."
 PRAYER_WHEEL_GLOSS: "#bold Prayer wheels#! are a conspicuous part of Tibetan Buddhist religious culture. They are wheels placed atop a spindle, made out of wood, stone, metal, leather, or cotton, that are typically decorated with prayers, most commonly the mantra #italic Om Mani Padme Hum#!. Larger prayer wheels are placed in temples and monasteries, while smaller, hand-held ones can be used are part of one's religious practice."


 # Miscellaneous Stuff
 MAITREYA_GLOSS: "In Buddhist cosmology, #bold Maitreya#! is the next Buddha who will come in a future time, succeeding the historical Buddha, Gautama Buddha; he is prophesized to appear when Buddhist teachings are in decline. Throughout the centuries, there have been many religious figures claiming to be Maitreya. For instance, in many parts of Asia, many historical rebels, particularly those who were from millenniaran sects, have claimed the mantle of Maitreya." 
 SINOSPHERE_GLOSS: "The #bold Sinosphere#! encompasses East Asia and parts of Southeast Asia that were heavily influenced by Chinese culture. The four major modern countries of the Sinosphere include China, Japan, Korea, and Vietnam, and historically included others in the region like the Khitan and Ryukyuan states. The Sinosphere countries shared, and continue to share, many elements and cultural influences, such as architectural styles; cuisine; ideologies steeped in Confucianism, Taoism, and Mahayana Buddhism; bureaucratic systems of governance influenced by Neo-Confucianism, often alongside a theoretically meritocratic examination system; and the adoption of Classical Chinese as a lingua franca for governance and literary writing."
