 monogatari.8000.t:0 "I'm Ready I'm Ready"
 monogatari.8000.desc:0 "[courtier.GetFirstName] says:\n\n#italic Hānau kū'oko'a 'ia nā kānaka apau loa, a ua kau like ka hanohano a me nā pono kīvila ma luna o kākou pākahi. Ua ku'u mai ka no'ono'o pono a me ka 'ike pono ma luna o kākou, no laila, e aloha kākou kekahi i kekahi.#!"
 monogatari.8000.a:0 "Ohana means no one gets left behind."
 monogatari.8000.b:0 "Aloha the hell out of here"
