 tradition_RICE_kava_culture_name:0 "Kava Ceremonies"
 tradition_RICE_kava_culture_desc:0 "#F Kava plays an important role in this culture and is seen as an expression of goodwill and sociability. It is frequently drunk during religious rituals, when socializing with others or debating political issues, and even with meals.#!"

 tradition_oceanic_voyagers_name:0 "Ocean Voyagers"
 tradition_oceanic_voyagers_desc:0 "#F This culture has a history of exploring strange new worlds, seeking out new life and islands, and going boldly where no one has gone before across the vast oceans, the final frontier of humankind.#!"

 tradition_RICE_palau_clubs_name:0 "Ranked Clubs"
 tradition_RICE_palau_clubs_desc:0 "People in this culture are assigned to be part in formal clubs called #italic Cheldebechel#! based on gender, age, as well as social rank, in line with the principle of [Glossary( 'bitang me a bitang', 'BITANG_ME_A_BITANG_GLOSS' )]. These clubs manage important tasks and activities, educate members on useful skills, oral traditions, and their roles in society, and regulate relationships within the community. They often meet at the #italic Bai#!, an all-purpose meeting hall."

 tradition_RICE_biak_adventurers_name:0 "Papuan Adventurers"
 tradition_RICE_biak_adventurers_desc:0 "Many in this culture will brave the high seas to seek food, trade, slaves, resources, allies, the thrill of battle, lands to settle, and cultural and technological ideas from afar. Swashbucklers who succeed in these adventures earn great prestige and honor."

 tradition_RICE_biak_songs_name:0 "Sing and Dance or Die"
