 RICE_oceania_quarry_stone_money:0 "Quarry Stone Money"
 RICE_oceania_quarry_stone_money_tooltip:0 "[Glossary( 'Rai stones', 'YAP_STONE_MONEY_GLOSS' )] are the way to show one's worth and status in society."
 RICE_oceania_quarry_stone_money_desc:0 "[Glossary( 'Rai stones', 'YAP_STONE_MONEY_GLOSS' )] used in our society are acquired from specific islands or lands in maritime expeditions. Their value increases the more dangerous and hazardous the journey was."
 RICE_oceania_quarry_stone_money_effect_tooltip_1:1 "You have a #V [GetPlayer.MakeScope.ScriptValue('RICE_himalayan_salt_expedition_success_chance')|0]%#! chance of success, which is influenced by your [traits|E] and [skills|E], especially [diplomacy_i|E] [diplomacy|E] and [stewardship_i|E] [stewardship|E]."
 RICE_oceania_quarry_stone_money_effect_tooltip_2:1 "You might lose up to #V 20%#! of your crew; this value is influenced by your [traits|E] and [skills|E], especially [martial_i|E] [martial|E] and [learning_i|E] [learning|E]"
 RICE_oceania_quarry_stone_money_effect_tooltip_3:1 "At the start of the expedition, you can spend extra [gold_i|E] [gold|E] to increase the chances of success and survival of the crew."
 RICE_oceania_quarry_stone_money_effect_tooltip_4:1 "If successful, you will gain a random amount of [prestige_i|E|E] [prestige|E] (up to #V [prestige_i|E] [GetPlayer.MakeScope.ScriptValue('RICE_himalayan_salt_expedition_max_prestige_display_value')|0]#!), [gold_i|E] [gold|E] (up to #V [gold_i|E] [GetPlayer.MakeScope.ScriptValue('RICE_himalayan_salt_expedition_max_gold_display_value')|0]#!), and [trait_level_track_xp|E] in the [GetTrait('RICE_stone_money').GetName( GetNullCharacter )|U] [trait|E] (up to #V 5#!)"
 RICE_oceania_quarry_stone_money_effect_tooltip_5:1 "If the expedition succeeds, for each percentage of crew that dies, you will #P gain#! additional [gold_i|E] [gold|E] and [trait_level_track_xp|E] in the [GetTrait('RICE_stone_money').GetName( GetNullCharacter )|U] [trait|E], but #N lose#! [piety_i|E] [piety|E]"
 RICE_oceania_quarry_stone_money_confirm:0 "Some may die, but it's a sacrifice we're willing to make!"
 RICE_oceania_quarry_stone_money_context_tooltip:0 "#emphasis Historical Context:#! xxxxx"
 
