 game_concept_situation_caucasus: "The Eagle, the Lion and the Mountain"
 game_concept_situation_caucasus_desc: "$game_concept_situation_caucasus$ represents the political conditions of the Southern Caucasus region in the middle ages. Shifting at times between nominal independence, Roman, Persian and Arab rule, the region has long been awash in the tides of faith, politics and history. Each part of the Southern Caucasus can be in a state of Roman, Perso-Arabic, Local or Disputed rule, with each phase representing a specific side gaining the upper hand in that region."