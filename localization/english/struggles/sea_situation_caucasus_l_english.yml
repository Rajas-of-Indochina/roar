 decision_form_cappadocia: "Unite the Cappadocians"
 decision_form_lesser_armenia: "Unite the Anatolian Armenians"
 decision_form_cappadocia_desc: "While we have been a part of $k_pontus$ for many centuries, our distinct culture and the geography of Cappadocia have long made us distinct from the Greek Heartlands. Let our distinctness be noted by its own crown."
 decision_form_lesser_armenia_desc: "Armenians have fled invasion after invasion from their home into the lands east of the highlands, and our people have lived in this region for centuries as a result. We are not merely the Armenians of Anatolia, we are ourselves a Lesser Armenia."
 decision_form_cappadocia_tooltip: "Form Cappadocia"
 decision_form_lesser_armenia_tooltip: "Form Lesser Armenia"
 decision_form_cappadocia_confirm: "Unite Our People"
 cappadocia_de_jure_drift_tt: "[GetTitleByKey('d_cappadocia').GetName], [GetTitleByKey('d_charsianon').GetName], and [GetTitleByKey('d_sebasteia').GetName] will become [de_jure|E] a part of [GetTitleByKey('k_cappadocia').GetName]."
 cappadocia_de_jure_extra_tt: "If you [completely_control|E] [GetTitleByKey('d_colonea').GetName], [GetTitleByKey('d_chaldia').GetName], [GetTitleByKey('d_lazeti').GetName], or [GetTitleByKey('d_speri').GetName], they will also become [de_jure|E] a part of [GetTitleByKey('k_cappadocia').GetName]."

 situation_caucasus_caucasian_empire_decision: "Form an Empire of the Caucasus"
 situation_caucasus_caucasian_empire_decision_desc: "Both the Romans to the west and the Arabs and Persians to the south have been defeated, humbled, and driven before you. With your power unquestioned and unquestionable, now is the time to seize your birthright as Emperor of the Caucasus."
 situation_caucasus_caucasian_empire_decision_tooltip: "End [GetSituation('situation_caucasus').GetName] with an Autonomist victory"
 situation_caucasus_caucasian_empire_decision_confirm: "I Am The Mountain!"

 situation_caucasus_armenian_empire_decision: "Form The Armenian Empire"
 situation_caucasus_armenian_empire_decision_desc: "The Armenian people have been ruled by foreign powers on and off for centuries, but we will never again be ruled. The empire of Tigranes will be reborn, and it will never again be torn asunder."
 situation_caucasus_armenian_empire_decision_tooltip: "$situation_caucasus_caucasian_empire_decision_tooltip$"
 situation_caucasus_armenian_empire_decision_confirm: "$situation_caucasus_caucasian_empire_decision_confirm$"
 situation_caucasus_transcaucasian_confederation_decision: "A Confederation of the Caucasus"
 situation_caucasus_transcaucasian_confederation_decision_desc: "The South Caucaucasus has never had a single king, nor has it ever needed one. The strength of our confederation proves that. Let us reaffirm our union and once and for all end the ambitions of those who would seek to rule us."
 situation_caucasus_transcaucasian_confederation_decision_tooltip: "$situation_caucasus_caucasian_empire_decision_tooltip$"
 situation_caucasus_transcaucasian_confederation_decision_confirm: "We Are The Mountain!"

