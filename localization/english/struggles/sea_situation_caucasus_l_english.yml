 heartland_region_tt: "#L #TOOLTIP:heartland_region_tt_contents $heartland_regions$#!#!"
 heartland_regions: "Heartland Regions"
 heartland_region_tt_contents: "The Heartlands of [GetSituation('situation_caucasus').GetName] are:\n$EFFECT_LIST_BULLET$[GetSituation('situation_caucasus').GetSubRegionByKey('armenia_proper').GetName]\n$EFFECT_LIST_BULLET$[GetSituation('situation_caucasus').GetSubRegionByKey('iberia').GetName]\n$EFFECT_LIST_BULLET$[GetSituation('situation_caucasus').GetSubRegionByKey('albania').GetName]\n\nThese represent regions that make up the core of the Southern Caucasus, and must be controlled by any side hoping to claim victory in the situation."
 frontier_region_tt: "#L #TOOLTIP:frontier_region_tt_contents $frontier_regions$#!#!"
 frontier_regions: "Frontier Regions"
 frontier_region_tt_contents: "The Frontier Regions of [GetSituation('situation_caucasus').GetName] are:\n$EFFECT_LIST_BULLET$[GetSituation('situation_caucasus').GetSubRegionByKey('persarmenia').GetName]\N$EFFECT_LIST_BULLET$[GetSituation('situation_caucasus').GetSubRegionByKey('lesser_armenia').GetName]\N$EFFECT_LIST_BULLET$[GetSituation('situation_caucasus').GetSubRegionByKey('cilicia').GetName]\N$EFFECT_LIST_BULLET$[GetSituation('situation_caucasus').GetSubRegionByKey('syria').GetName]\N$EFFECT_LIST_BULLET$[GetSituation('situation_caucasus').GetSubRegionByKey('jazira').GetName]\n\nThese regions are less crucial to victory in the Southern Caucasus, but can provide a valuable buffer or extra benefits if controlled."

