 situation_caucasus_align_faith_decision_desc: "My position as a [GetSituation('situation_caucasus').GetParticipantGroupByCharacter( ROOT.Char ).GetName] stands at odds with the rest of the faithful, my political importance may permit me to change my faith's official position."
