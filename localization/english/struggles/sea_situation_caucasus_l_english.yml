 situation_caucasus_align_culture_decision: "Realign the [ROOT.Char.GetCulture.GetNameNoTooltip] People"
 situation_caucasus_align_culture_decision_desc: "While I may be [GetSituation('situation_caucasus').GetParticipantGroupByCharacter( ROOT.Char ).GetName], the rest of my people are not so inclined to such beliefs. However, with the pull that I have among my people, I can convince them that it's on our best interest."
