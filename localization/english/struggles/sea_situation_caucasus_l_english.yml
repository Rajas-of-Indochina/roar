l_english:
 situation_situation_caucasus: "$situation_type_situation_caucasus$"
 situation_situation_caucasus_desc: "[SITUATION.GetType.GetDesc]"
 situation_type_situation_caucasus: "$game_concept_situation_caucasus$"
 situation_type_situation_caucasus_desc: "$game_concept_situation_caucasus_desc$"
 game_concept_situation_caucasus: "The Eagle, the Lion and the Mountain"
 game_concept_situation_caucasus_desc: "$game_concept_situation_caucasus$ represents the political conditions of the Southern Caucasus region in the middle ages. Shifting at times between nominal independence, Roman, Persian and Arab rule, the region has long been awash in the tides of faith, politics and history. Each part of the Southern Caucasus can be in a state of Roman, Perso-Arabic, Local or Disputed rule, with each phase representing a specific side gaining the upper hand in that region."
 situation_caucasus_perso_arabic_control: "Perso-Arabic Control"
 situation_caucasus_perso_arabic_control_desc: "Forces aligned with Persian and Arab spheres dominate the political landscape."
 situation_caucasus_situation_caucasus_perso_arabic_control_situation_phase: "$situation_caucasus_perso_arabic_control$"
 situation_caucasus_roman_control: "Roman Control"
 situation_caucasus_roman_control_desc: "Forces aligned with the Roman Empire control the political landscape."
 situation_caucasus_situation_caucasus_roman_control_situation_phase: "$situation_caucasus_roman_control$"
 situation_caucasus_local_control: "Local Control"
 situation_caucasus_local_control_desc: "Autonomist forces loyal to neither Persia nor Rome assert their independence."
 situation_caucasus_situation_caucasus_local_control_situation_phase: "$situation_caucasus_local_control$"
 situation_caucasus_disputed_control: "Disputed Control"
 situation_caucasus_disputed_control_desc: "The region is in disarray, either under no clear control or controlled by foreign interlopers."
 situation_caucasus_situation_caucasus_disputed_control_situation_phase: "$situation_caucasus_disputed_control$"

 situation_caucasus_participant_group_pro_roman: "Pro-Roman"
 situation_caucasus_participant_group_pro_roman_desc: "Those in the Southern Caucasus that have chosen to align their interests with those of the Basileus in Byzantion."
 situation_caucasus_participant_group_pro_perso_arabic: "Pro-Perso-Arabic"
 situation_caucasus_participant_group_pro_perso_arabic_desc: "Those in the Southern Caucasus that prefer to align with the cultural and political force of the broader Persian and Islamic spheres."
 situation_caucasus_participant_group_autonomist: "Autonomist"
 situation_caucasus_participant_group_autonomist_desc: "Those in the Southern Caucasus that reject foreign rule, be they Roman, Persian, Arab or from more far-flung places."
 situation_caucasus_participant_group_interloper: "Interloper"
 situation_caucasus_participant_group_interloper_desc: "Intruders into the struggle for the Southern Caucasus. Will they join a side, or try to flip the table?"

