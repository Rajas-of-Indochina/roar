 situation_parameter_unlocks_consolidate_roman_territory_casus_belli: "Unlocks the Consolidate Roman Territory casus belli"
 situation_parameter_unlocks_join_war_against_pro_romans: "Can join offensive wars against Pro-Roman characters"
 situation_parameter_unlocks_join_war_against_pro_perso_arabs: "Can join offensive wars against Pro-Perso-Arabic characters"
 situation_parameter_county_conversion_faster_in_subregion: "Increased conversion speed of counties to cultures and faiths of this faction within the [situation_sub_region|E]"
 situation_parameter_slowed_county_conversion: "Slower conversion speed of counties within the [situation_sub_region|E]"
 situation_parameter_revolt_more_common: "Communalist, Populist and Peasant factions more common within the [situation_sub_region|E]"
 situation_parameter_can_join_autonomist_uprisings: "Can join Autonomist-aligned Populist, Peasant and Communalist factions regardless of faith or culture"
 situation_parameter_unlock_autonomist_confederation: "Can form Autonomist Confederations"

 situation_caucasus_participant_group_pro_roman: "Pro-Roman"
 situation_caucasus_participant_group_pro_roman_desc: "Those in the Southern Caucasus that have chosen to align their interests with those of the Basileus in Byzantion."
 situation_caucasus_participant_group_pro_perso_arabic: "Pro-Perso-Arabic"
 situation_caucasus_participant_group_pro_perso_arabic_desc: "Those in the Southern Caucasus that prefer to align with the cultural and political force of the broader Persian and Islamic spheres."
 situation_caucasus_participant_group_autonomist: "Autonomist"
 situation_caucasus_participant_group_autonomist_desc: "Those in the Southern Caucasus that reject foreign rule, be they Roman, Persian, Arab or from more far-flung places."
 situation_caucasus_participant_group_interloper: "Interloper"
 situation_caucasus_participant_group_interloper_desc: "Intruders into the struggle for the Southern Caucasus. Will they join a side, or try to flip the table?"

