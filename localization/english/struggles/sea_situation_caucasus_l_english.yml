 custom_armenia_proper: "Armenia Proper"
 situation_caucasus_sub_region_armenia_proper: "[GetGeographicalRegion('custom_armenia_proper').GetName]"
 situation_caucasus_sub_region_armenia_proper_desc: "The ancestral homeland of the Armenian people, ruled variously by Romans, Arabs and local Armenian Princes."
 custom_caucasian_albania: "Caucasian Albania"
 situation_caucasus_sub_region_albania: "[GetGeographicalRegion('custom_caucasian_albania').GetName]"
 situation_caucasus_sub_region_albania_desc: "Mostly overlapping with what is now called Azerbaijan, this region has historically been called home by the local [GetCultureByKey('udi').GetName] for centuries, later coming under Persian rule by the Safavids."
 custom_caucasian_iberia: "Caucasian Iberia"
 situation_caucasus_sub_region_iberia: "[GetGeographicalRegion('custom_caucasian_iberia').GetName]"
 situation_caucasus_sub_region_iberia_desc: "The homeland of the [GetCultureByKey('georgian').GetName], [GetCultureByKey('abkhaz').GetName] and [GetCultureByKey('laz').GetName] peoples. It has variously passed through staged of independence, Arab rule and Roman vassalage."
 custom_persarmenia: "Persarmenia"
 situation_caucasus_sub_region_persarmenia: "[GetGeographicalRegion('custom_persarmenia').GetName]"
 situation_caucasus_sub_region_persarmenia_desc: "On the border of Persia and Armenia proper, Persarmenia or $k_adurbadagan$ has been part of the broad Arab-Persian sphere for centuries, inhabited primarily by West Iranians."
 custom_lesser_armenia: "Lesser Armenia"
 situation_caucasus_sub_region_lesser_armenia: "[GetGeographicalRegion('custom_lesser_armenia').GetName]"
 situation_caucasus_sub_region_lesser_armenia: "A border region situated at the western end of the Armenian Highlands, where Armenia transitions into Anatolia. The area has remained under Roman control through much of the middle ages, serving as a refuge for Armenian refugees fleeing Arab conquest, and remaining under Roman control until the Suljuk invasions in the 11th century."
 custom_syria: "Syria"
 situation_caucasus_sub_region_syria: "[GetGeographicalRegion('custom_syria').GetName]"
 situation_caucasus_sub_region_syria_desc: "A former province of the Roman Empire, Syria was annexed in the 7th century by the invading Rashidun Caliphate, and remained a frontier in power struggles between Rome and the Arabian peninsula for centuries."
 custom_jazira: "Jazira"
 situation_caucasus_sub_region_jazira: "[GetGeographicalRegion('custom_jazira').GetName]"
 situation_caucasus_sub_region_jazira_desc: "$custom_jazira$ has been inhabited by civilizations of some form for over a millennium and was once home to the capital of the ancient Assyrian empire. In the present, it is not a great capital, but rather a province of another empire."
 custom_armenian_cilicia: "Cilicia"
 situation_caucasus_sub_region_cilicia: "[GetGeographicalRegion('custom_armenian_cilicia').GetName]"
 situation_caucasus_sub_region_cilicia_desc: "The meeting of the Anatolian Peninsula and the Levant. Like Lesser Armenia, it became a refuge for Armenians fleeing invasions, and was historically home to an Armenian kingdom and temporary home for the Catholicos of the Armenian Church."

 custom_aluank: "Aghvan Heartlands"

