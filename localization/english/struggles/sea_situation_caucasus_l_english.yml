 heartland_region_tt_contents: "The Heartlands of [GetSituation('situation_caucasus').GetName] are:\n$EFFECT_LIST_BULLET$[GetSituation('situation_caucasus').GetSubRegionByKey('armenia_proper').GetName]\n$EFFECT_LIST_BULLET$[GetSituation('situation_caucasus').GetSubRegionByKey('iberia').GetName]\n$EFFECT_LIST_BULLET$[GetSituation('situation_caucasus').GetSubRegionByKey('albania').GetName]\n\nThese represent regions that make up the core of the Southern Caucasus, and must be controlled by any side hoping to claim victory in the situation."
